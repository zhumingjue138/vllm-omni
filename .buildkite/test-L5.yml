# L5 GPU monitor pipeline: run test with GPU monitoring, then send report email.
# Trigger: set env L5=1 (e.g. in Buildkite) and have a step in the main pipeline that
# runs: buildkite-agent pipeline upload .buildkite/test-L5.yml

steps:
  - label: ":chart_with_downwards_trend: L5 GPU monitor test"
    key: l5-gpu-test
    timeout_in_minutes: 60
    depends_on: image-build
    commands:
      - bash tests/e2e/online_serving/L5/gpu_monitor.sh run -- pytest -s -v tests/e2e/online_serving/test_qwen3_omni_full.py -k test_text_to_text_async_chunk_003 -v
    agents:
      queue: "gpu_1_queue"
    plugins:
      - docker#v5.2.0:
          image: public.ecr.aws/q9t5s3a7/vllm-ci-test-repo:$BUILDKITE_COMMIT
          always-pull: true
          propagate-environment: true
          environment:
            - "HF_HOME=/fsx/hf_cache"
          volumes:
            - "/fsx/hf_cache:/fsx/hf_cache"

  - label: ":email: L5 GPU monitor email"
    key: l5-gpu-email
    depends_on: l5-gpu-test
    commands:
      - mkdir -p gpu_monitor_bundle
      - buildkite-agent artifact download "report.html" gpu_monitor_bundle/ --step "l5-gpu-test"
      - buildkite-agent artifact download "gpu_metrics.csv" gpu_monitor_bundle/ --step "l5-gpu-test"
      - buildkite-agent artifact download "README.txt" gpu_monitor_bundle/ --step "l5-gpu-test" || true
      - export GPU_MONITOR_BUNDLE_DIR="$PWD/gpu_monitor_bundle"
      - export BUILDKITE_BUILD_URL="${BUILDKITE_BUILD_URL:-N/A}"
      - export BUILDKITE_COMMIT="${BUILDKITE_COMMIT:-N/A}"
      # SMTP/DAILY_EMAIL_LIST must be set in Buildkite env or secrets
      - python tools/L5/send_gpu_monitor_email.py --bundle-dir "$GPU_MONITOR_BUNDLE_DIR"
    agents:
      queue: "cpu_queue_premerge"
